[project]
name = "tender-summarizer"
version = "0.1.0"
description = ""
authors = [
    {name = "Wiltort",email = "wiltort21@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "openai (>=3.3.0,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
lint.select = [
    "F",  # pyflakes: неиспользуемые импорты/переменные, неопределённые имена
    "E",  # pycodestyle: явные ошибки стиля
    "W",  # pycodestyle: предупреждения
]
lint.ignore = [
    "E501",  # не жёстко ограничивать длину строк
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=8.4.0,<9.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
app = "main:start"
